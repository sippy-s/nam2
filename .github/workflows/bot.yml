name: Namasha Bot

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install httpx playwright
          python -m playwright install --with-deps chromium

      - name: Show files
        run: |
          echo "=== Files ==="
          ls -la
          echo "=== config ==="
          cat config.json || echo "MISSING"
          echo "=== cookies ==="
          ls -la cookies*.json || echo "NO COOKIES"

      - name: Run bot
        env:
          PYTHONUNBUFFERED: "1"
        run: python bot.py auto

      - name: Upload artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-output
          path: |
            capture.json
            capture_backup.json
            page_debug.html
            debug_screenshot.png
          if-no-files-found: ignore
